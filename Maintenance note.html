<!DOCTYPE html>

<title>A320 Family Maintenance Note </title>

<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #050607 0%, #0b1118 100%);
    color: #cfe8ff;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

.header-container {
            width: 100%;
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-start;
            box-sizing: border-box;
            border-bottom: 2px solid #334155;
        }
		
  .app {
    max-width: 430px;
    width: 100%;
    padding: 12px;
  }

  h2 {
    margin-bottom: 16px;
    font-size: 22px;
  }

  /* CARD STACK CONTAINER */
  .card-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* CARD SYSTEM */
  .menu-card {
    background: #0f1720;
    border: 1px solid #2a3a4d;
    border-radius: 18px; /* Smooth rounded corners matching the photo */
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
  }

  /* IMAGE BACKGROUND PLACEHOLDERS */
  .card-image {
    height: 140px;
    background-size: cover;
    background-position: center;
    border-bottom: 1px solid #2a3a4d;
  }

  /* CARD TITLE LABEL */

    padding: 16px;
    text-align: center;
    font-weight: 600;
    font-size: 18px;
    color: #cfe8ff;
    background: #ffffff; /* White background banner matching the photo */
    color: #1c252e; /* Dark slate text color for contrast */
    transition: all 0.2s ease;
  }

  /* INTERACTIVE HOVER EFFECTS */
  .menu-card:hover {
    border-color: #00c8ff;
    box-shadow: 0 0 14px #00c8ff55;
  }

  .menu-card:hover .card-title {
    color: #00c8ff;
    background: #0f1720; /* Flips back to system dark theme on hover */
  }
