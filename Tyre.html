<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Status Table</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 15px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a252f;
            font-size: 1.4rem;
            font-weight: 600;
        }

        /* Responsive Table Container */
        .table-container {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
		.header-container {
            width: 100%;
            background-color: #1e293b;
            padding: 10px 15px;
            display: flex;
            justify-content: flex-start;
            box-sizing: border-box;
            border-bottom: 2px solid #334155;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 14px 16px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.95rem;
        }

        /* Row alternate coloring */
        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        /* Hover effect */
        tr:hover {
            background-color: #f1f5f9;
        }

        /* Badge design for Aircraft Names */
        .aircraft-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }

        /* Style for ranges */
        .range-text {
            color: #475569;
            font-weight: 500;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            th, td {
                padding: 12px 10px;
                font-size: 0.85rem;
            }
            .aircraft-badge {
                font-size: 0.8rem;
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Aircraft Tyre Pressure Data Of AMM</h2>
    
	<div class="header-container">
        <button onclick="goMain()" style="background: #0284c7; color: white; padding: 10px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; border-bottom: 4px solid #0369a1; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.1s;\" onmousedown=\"this.style.transform='translateY(2px)'; this.style.borderBottomWidth='2px'; this.style.boxShadow='0 2px 3px rgba(0,0,0,0.2)';\" onmouseup=\"this.style.transform='translateY(0)'; this.style.borderBottomWidth='4px'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.2)';\">Main</button>
    </div>
	
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Aircraft</th>
                    <th>NLG (psi)</th>
                    <th>MLG (psi)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="aircraft-badge">XY-AGR</span></td>
                    <td class="range-text">181-190</td>
                    <td class="range-text">187-196</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-AGV</span></td>
                    <td class="range-text">181-190</td>
                    <td class="range-text">187-196</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALK</span></td>
                    <td class="range-text">191-200</td>
                    <td class="range-text">200-210</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALT</span></td>
                    <td class="range-text">178-187</td>
                    <td class="range-text">200-210</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALJ</span></td>
                    <td class="range-text">178-187</td>
                    <td class="range-text">209-219</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALY</span></td>
                    <td class="range-text">175-184</td>
                    <td class="range-text">181-190</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALN</span></td>
                    <td class="range-text">165-174</td>
                    <td class="range-text">173-181</td>
                </tr>
                <tr>
                    <td><span class="aircraft-badge">XY-ALZ</span></td>
                    <td class="range-text">175-184</td>
                    <td class="range-text">181-190</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>

	 <script>
	function goMain() {
    window.location.href = "Maintenance note.html";
  }
  </script>
