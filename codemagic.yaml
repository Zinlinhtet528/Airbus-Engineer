workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 22

    scripts:
      - node -v
      - npm cache clean --force

      # 🔥 clean install (important)
      - rm -rf node_modules package-lock.json

      - npm install

      # 🔥 force correct Capacitor version
      - npm install @capacitor/core@latest @capacitor/cli@latest

      # 🔥 now safe again
      - npx cap sync ios

    artifacts:
      - ios/App/build/**/*.app
