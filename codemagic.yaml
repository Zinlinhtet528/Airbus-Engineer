workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 22

    scripts:
      - npm install
      - npm install @capacitor/core @capacitor/cli

      # 🔥 FIX: bypass broken npx binary
      - node node_modules/@capacitor/cli/bin/capacitor.js sync ios

    artifacts:
      - ios/App/build/**/*.app
