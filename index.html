<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECAM UI</title>

<style>
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #050607 0%, #0b1118 100%);
    color: #cfe8ff;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    max-width: 430px;
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
  }

  h2 {
    margin-bottom: 15px;
    font-weight: 600;
  }

  /* GRID CONTAINER */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  /* BASE BUTTON STYLE */
  .tab {
    position: relative;
    padding: 38px 5px 12px 5px; /* အပေါ်က အိုင်ကွန်နဲ့ စာသား မထပ်အောင် Padding ချန်ထားပါတယ် */
    background-color: #0f1720;
    
    /* Background Icon Setup */
    background-position: center 12px; 
    background-repeat: no-repeat;
    background-size: 20px 20px;
    
    border: 1px solid #2a3a4d;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 10px;
    color: #cfe8ff;
    transition: all 0.2s ease;
    text-transform: uppercase;
    overflow: hidden;
  }

  /* HOVER & ACTIVE STATES */
  .tab:hover {
    border-color: #00c8ff;
    box-shadow: 0 0 10px #00c8ff44;
    color: #00c8ff;
  }
